<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einladung zu Increvio</title>
<meta name="description" content="Du wurdest zu Increvio eingeladen. Zusammen bleibt ihr dran, und ihr bekommt beide 1 Monat Plus gratis.">
<meta property="og:title" content="Du wurdest zu Increvio eingeladen">
<meta property="og:description" content="Zusammen dranbleiben. Über den Link bekommt ihr beide 1 Monat Plus gratis.">
<meta property="og:image" content="https://increvio.com/img/essen.jpg">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../style.css">
<style>
  .code { font-family: var(--title); font-size: 2.6rem; letter-spacing: .25em; font-weight: 800; margin: .3em 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
  .stack .btn { text-align: center; }
  .btn.ghost { background: transparent; color: var(--glut-text); border: 2px solid var(--glut); }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="../"><img src="../favicon.svg" alt="" width="30" height="30">Increvio</a>
</div></header>
<main class="wrap narrow">
<h1>Du wurdest eingeladen 💪</h1>
<p>Zusammen bleibt ihr dran. Über diese Einladung bekommt ihr beide <strong>1 Monat Plus gratis</strong>.</p>
<div id="withCode" hidden>
  <p class="note">Dein Einladungscode</p>
  <p class="code" id="code"></p>
</div>
<div class="stack">
  <a class="btn" id="open" href="increvio://">In der App öffnen</a>
  <a class="btn ghost" href="https://testflight.apple.com/join/SUXFCQPe">App laden</a>
</div>
<p class="note">Noch keine App? Erst laden, dann diesen Link noch mal antippen oder den Code unter „Freunde“ eingeben.</p>
</main>
<script>
  // Code aus ?c=ABC123 (nur Buchstaben und Ziffern, 6 Zeichen).
  var raw = new URLSearchParams(location.search).get("c") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  if (code.length === 6) {
    document.getElementById("code").textContent = code;
    document.getElementById("withCode").hidden = false;
    document.getElementById("open").href = "increvio://invite/" + code;
  }
</script>
</body>
</html>
