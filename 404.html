<main class="wrap narrow">
<div id="invite" hidden>
<h1>You've been invited</h1>
<p class="sub">Train together. It's easier.</p>
<div id="withCode" hidden>
  <p class="note">Your invite code</p>
  <p class="code" id="code"></p>
</div>
<div class="stack">
  <a class="btn" id="open" href="increvio://">Open in the app</a>
  <a class="btn btn-light" id="get" href="https://apps.apple.com/app/increvio/id6825500313">Get the app</a>
</div>
<p class="note" id="hint">No app yet? Get it, then tap this link again.</p>
<p class="note" id="copied" hidden>Invite copied. Open the app and paste it when asked.</p>
</div>
<div id="missing">
<h1>Page not found</h1>
<p class="sub">This page is gone. Let's get you back.</p>
<p style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px"><a class="btn" href="/">Home</a><a class="btn btn-light" href="/guides/">Guides</a></p>
</div>
</main>
<script>
  // GitHub Pages zeigt diese Seite für jede unbekannte Adresse. Einladungen: /i/ABC123 (?challenge=… oder ?workout=…).
  var match = location.pathname.match(/^\/i\/([A-Za-z0-9]{6})\/?$/);
  if (match) {
    var code = match[1].toUpperCase();
    var query = new URLSearchParams(location.search);
    var extra = new URLSearchParams();
    ["challenge", "workout"].forEach(function (k) { var v = query.get(k); if (v && /^\d+$/.test(v)) extra.set(k, v); });
    document.title = "Invitation to Buffd";
    document.getElementById("code").textContent = code;
    document.getElementById("withCode").hidden = false;
    document.getElementById("open").href = "increvio://invite/" + code + (extra.toString() ? "?" + extra.toString() : "");
    document.getElementById("invite").hidden = false;
    // Einladung nicht verlieren (24.10.): Link beim Tippen auf „App laden“ in die Zwischenablage legen.
    // Die App bietet ihn auf der ersten Seite zum Einfügen an.
    // Die App erkennt bis zum nächsten Update nur increvio.com-Links, deshalb immer diese Adresse kopieren.
    var link = "https://increvio.com/i/" + code + (extra.toString() ? "?" + extra.toString() : "");
    document.getElementById("get").addEventListener("click", function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          document.getElementById("hint").hidden = true;
          document.getElementById("copied").hidden = false;
        }).catch(function () {});
      }
    });
    document.getElementById("missing").hidden = true;
  } else {
    location.replace("https://buffd.app" + location.pathname + location.search + location.hash);
  }
</script>
</body>
